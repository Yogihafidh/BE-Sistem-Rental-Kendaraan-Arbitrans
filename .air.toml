#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

  [build]
    cmd = "go build -o ./tmp/main.exe ./cmd/api"
    bin = "tmp/main.exe"
    full_bin = "tmp/main.exe"
    include_ext = ["go", "tpl", "tmpl", "html"]
    exclude_dir = ["assets", "tmp", "vendor", "database"]
    delay = 1000
    stop_on_error = true
    send_interrupt = false
    kill_delay = 500

  [build.windows]
    args_bin = []
    bin = "tmp\\main.exe"
    cmd = "go build -o ./tmp/main.exe ./cmd/api"
    entrypoint = ["tmp\\main.exe"]
    full_bin = ""
    post_cmd = []
    pre_cmd = []

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
